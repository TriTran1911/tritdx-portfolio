<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tri Tran — Mobile & Frontend Engineer</title>
  <meta name="description" content="Mobile and frontend engineer in Ho Chi Minh City. Flutter and React Native in production for metro payments, insurance CRM and retail loyalty — plus tools I build to make that work faster." />
  <meta name="theme-color" content="#0C0D0F" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta property="og:title" content="Tri Tran — Mobile & Frontend Engineer" />
  <meta property="og:description" content="Flutter and React Native in production. Plus the tools I build to make that work faster." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://tritdx.io.vn/" />
  <!-- Cả tritdx.io.vn và www đều trỏ về Pages. Cloudflare Pages khớp _redirects
       theo đường dẫn nên không chuyển hướng được theo host; khai canonical để
       công cụ tìm kiếm chỉ ghi nhận một địa chỉ, không chia đôi. -->
  <link rel="canonical" href="https://tritdx.io.vn/" />
  <meta property="og:image" content="https://tritdx.io.vn/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Tri Tran — mobile and frontend engineer, Ho Chi Minh City" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Font hiển thị tự host và preload: nó vẽ tên ở đầu trang, chậm một nhịp
       là người xem thấy Georgia rồi mới thấy Instrument Serif. -->
  <link rel="preload" href="/fonts/instrument-serif-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
  <style>
    @font-face {
      font-family: 'Instrument Serif';
      font-style: normal; font-weight: 400; font-display: swap;
      src: url('/fonts/instrument-serif-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
        U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
        U+2212, U+2215, U+FEFF, U+FFFD;
    }
  </style>
</head>
<body>
  <!-- GSAP .from() đặt opacity:0 ngay lập tức. JS chặn hoặc lỗi tải là toàn bộ
       nội dung biến mất vĩnh viễn — với một portfolio thì đó là mất trắng, và
       trình thu thập dữ liệu cũng không đọc được. Buộc hiện lại khi không có JS. -->
  <noscript>
    <style>
      [data-hero-meta], [data-hero-line], [data-node], [data-logrow],
      [data-caption], [data-packet] { opacity: 1 !important; }
      [data-hero-rule] { transform: none !important; }
    </style>
  </noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
